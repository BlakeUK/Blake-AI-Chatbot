{{define "content"}}
<section class="card narrow">
  <h1>Change password</h1>
  {{if .Data.Forced}}<p class="notice">You must choose a new password before you can continue.</p>{{end}}
  <form method="post" action="/admin/password">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <label>Current password
      <input name="current" type="password" autocomplete="current-password" required>
    </label>
    <label>New password <span class="muted">(at least 12 characters)</span>
      <input name="new" type="password" autocomplete="new-password" minlength="12" required>
    </label>
    <label>Confirm new password
      <input name="confirm" type="password" autocomplete="new-password" minlength="12" required>
    </label>
    <button type="submit" class="primary">Change password</button>
  </form>
</section>
{{end}}
