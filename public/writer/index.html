<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Writing assistant | Blake UK</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/writer/writer.css">
<style>
  :root { --blue:#485cc7; --navy:#1c2766; --line:#d9deef; --bg:#f3f5fb; --muted:#5b6479; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:#1b2230; font:16px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  header { background:#fff; border-bottom:1px solid var(--line); padding:12px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header img { height:32px; display:block; }
  header h1 { font-size:1.15rem; margin:0; color:var(--navy); }
  header .right { margin-left:auto; display:flex; gap:10px; align-items:center; font-size:.92rem; }
  header .right a { display:inline-block; padding:.4rem 1rem; border:1px solid var(--blue); border-radius:999px; font-weight:600; text-decoration:none; color:var(--blue); background:#fff; transition:background .15s,color .15s; }
  header .right a:hover { background:var(--blue); color:#fff; }
  a { color:var(--blue); }
  main { max-width:1180px; margin:0 auto; padding:20px 16px 56px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 20px; }
  h2 { font-size:1.05rem; margin:0 0 .5rem; color:var(--navy); }
  p.hint { color:var(--muted); font-size:.92rem; margin:.2rem 0 .8rem; }
  label { display:block; font-weight:600; margin:.4rem 0 .25rem; }
  input[type=text], input[type=password] { font:inherit; padding:.5rem .6rem; border:1px solid #aab3d6; border-radius:8px; background:#fff; max-width:100%; }
  button { font:inherit; font-weight:600; border:0; border-radius:9px; padding:.6rem 1.2rem; cursor:pointer; background:var(--blue); color:#fff; }
  button:hover { background:#3a4cae; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:.8rem; }
  .note { border-radius:10px; padding:.55rem .9rem; margin:.6rem 0; font-size:.95rem; }
  .note.err { background:#fdeceb; border:1px solid #f0a9a4; }
  .small { font-size:.88rem; color:var(--muted); }
  #signin { max-width:420px; margin:40px auto; } #signin input { width:100%; margin-bottom:.6rem; }
  [hidden] { display:none !important; }
  #root.wr { padding:0; background:transparent; }
</style>
</head>
<body>
<header>
  <img src="/assets/blake-uk-logo.png" alt="Blake UK">
  <h1>Writing assistant</h1>
  <div class="right"><span id="who" class="small"></span><a href="/admin/" target="_blank" rel="noopener">Admin</a><a href="#" id="signout" hidden>Sign out</a></div>
</header>

<main>
  <section id="signin" class="card" hidden>
    <h2>Sign in</h2>
    <p class="hint">Use the same details as the admin. Staff only.</p>
    <div id="signin-error" class="note err" role="alert" hidden></div>
    <form id="signin-form">
      <div id="step1"><label for="u">User name</label><input id="u" type="text" autocomplete="username" required>
        <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required></div>
      <div id="step2" hidden><label for="c">Code from your authenticator app</label><input id="c" type="text" inputmode="numeric" autocomplete="one-time-code"></div>
      <div class="row"><button type="submit">Sign in</button></div>
    </form>
  </section>

  <section id="tool" hidden><div id="root"></div></section>
</main>

<script src="/writer/writer-lib.js"></script>
<script src="/writer/writer-ui.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var csrf = '', mounted = null;
  function api(method, url, body) {
    return fetch(url, { method: method, credentials: 'same-origin', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, data: j }; }); });
  }
  function show(el, on) { el.hidden = !on; }
  function showError(msg) { var e = $('signin-error'); e.textContent = msg || ''; show(e, !!msg); }
  function ready(s) {
    csrf = s.csrf || '';
    $('who').textContent = s.username ? 'Signed in as ' + s.username : '';
    show($('signin'), false); show($('tool'), true); show($('signout'), true);
    if (!mounted) mounted = WriterUI.mount($('root'), { getCsrf: function () { return csrf; }, onAuthLost: needSignIn });
    mounted.focus();
  }
  function needSignIn() { show($('tool'), false); show($('signin'), true); show($('signout'), false); $('who').textContent = ''; }
  api('GET', '/api/admin/login.php').then(function (r) {
    if (r.status === 200 && r.data.ok) ready({ csrf: r.data.csrf, username: r.data.username }); else needSignIn();
  }).catch(needSignIn);
  $('signin-form').addEventListener('submit', function (e) {
    e.preventDefault(); showError('');
    var twofa = !$('step2').hidden;
    var body = twofa ? { code: $('c').value.trim() } : { username: $('u').value.trim(), password: $('p').value };
    api('POST', '/api/admin/login.php', body).then(function (r) {
      if (r.data.requires_2fa) { show($('step1'), false); show($('step2'), true); $('c').focus(); return; }
      if (r.data.ok) { $('p').value = ''; ready({ csrf: r.data.csrf, username: $('u').value.trim() }); return; }
      showError(r.data.error || 'That did not work. Please try again.');
    }).catch(function () { showError('Could not reach the server. Please try again.'); });
  });
  $('signout').addEventListener('click', function (e) { e.preventDefault(); api('DELETE', '/api/admin/login.php').then(function () { location.reload(); }); });
})();
</script>
</body>
</html>
