[package]
name = "operator-console"
version = "0.6.0"
description = "Blake UK operator console - ticket notifications and department routing"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["notification-all", "system-tray", "shell-open", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
open = "5"

[features]
# This feature is used for production builds or when a dev server is not
# specified, DO NOT REMOVE - required by `cargo tauri build`, which enables
# it automatically and needs the app's own Cargo.toml to declare and forward
# it to the tauri crate. Missing this is exactly what "the package
# 'operator-console' does not contain this feature: custom-protocol" means.
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "operator-console"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
