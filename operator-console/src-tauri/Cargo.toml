[package]
name = "operator-console"
version = "0.21.0"
description = "Blake UK operator console - live chat and support ticket desk"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
open = "5"

[features]
# Required by `cargo tauri build`, which enables it automatically and needs the
# app's own Cargo.toml to declare it and forward it to the tauri crate.
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "operator-console"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
