<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blake UK Operator Console</title>
<style>
  :root {
    --bg: #14151d; --surface: #1d1f2a; --surface-2: #262838;
    --border: #363948; --text: #e9e9ed; --text-dim: #9a9ca8;
    --accent: #9184d9; --accent-dim: #4a4470;
    --ok: #4caf7d; --warn: #d9a441; --err: #e05a5a;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; height: 100vh; overflow: hidden; }
  button { font-family: inherit; cursor: pointer; }
  .btn { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px 14px; font-size: 13px; }
  .btn:hover { border-color: var(--accent); }
  .btn-primary { background: var(--accent-dim); border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent); }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  input, select, textarea { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 13px; font-family: inherit; width: 100%; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .hidden { display: none !important; }

  /* ── Login ── */
  #login-screen { height: 100%; display: flex; align-items: center; justify-content: center; }
  #login-box { width: 320px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; }
  #login-box h1 { font-size: 17px; margin: 0 0 4px; }
  #login-box .sub { color: var(--text-dim); font-size: 12px; margin: 0 0 20px; }
  #login-box label { display: block; font-size: 12px; color: var(--text-dim); margin: 12px 0 4px; }
  #login-box .err { color: var(--err); font-size: 12px; margin-top: 10px; min-height: 14px; }
  #login-box .server-row { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
  #login-box .server-row label { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }

  /* ── App shell ── */
  #app { display: none; height: 100%; flex-direction: column; }
  #topbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #topbar .brand { font-weight: 600; font-size: 13px; }
  #topbar .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 6px; }
  #topbar .right { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-dim); }
  #main { flex: 1; display: flex; min-height: 0; }

  /* ── Ticket list ── */
  #sidebar { width: 320px; flex-shrink: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  #filters { display: flex; gap: 6px; padding: 10px; border-bottom: 1px solid var(--border); }
  #filters select { font-size: 12px; padding: 5px 6px; }
  #ticket-list { flex: 1; overflow-y: auto; }
  .ticket-row { padding: 12px 14px; border-bottom: 1px solid var(--border); cursor: pointer; position: relative; }
  .ticket-row:hover { background: var(--surface); }
  .ticket-row.active { background: var(--surface-2); border-left: 3px solid var(--accent); }
  .ticket-row.is-new::before { content: ""; position: absolute; top: 14px; left: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--err); }
  .ticket-row .subj { font-size: 13px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ticket-row .meta { display: flex; gap: 6px; align-items: center; }
  .badge { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 10px; text-transform: uppercase; letter-spacing: .03em; }
  .badge-open { background: #3a2f14; color: var(--warn); }
  .badge-pending { background: #2a2340; color: var(--accent); }
  .badge-closed { background: #232532; color: var(--text-dim); }
  .badge-dept { background: var(--surface-2); color: var(--text-dim); border: 1px solid var(--border); }
  #ticket-list .empty { padding: 30px 16px; text-align: center; color: var(--text-dim); font-size: 13px; }

  /* ── Detail pane ── */
  #detail { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #detail .empty-state { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 13px; }
  #detail-header { padding: 16px 20px; border-bottom: 1px solid var(--border); }
  #detail-header h2 { margin: 0 0 6px; font-size: 15px; }
  #detail-header .sub { color: var(--text-dim); font-size: 12px; }
  #detail-controls { display: flex; gap: 8px; padding: 12px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; align-items: center; }
  #detail-controls .group { display: flex; align-items: center; gap: 6px; }
  #detail-controls label { font-size: 12px; color: var(--text-dim); }
  #transcript { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 75%; padding: 9px 12px; border-radius: 10px; font-size: 13px; line-height: 1.5; }
  .msg-customer { background: var(--surface-2); align-self: flex-start; }
  .msg-assistant { background: var(--accent-dim); align-self: flex-end; }
  .msg-meta { font-size: 10px; color: var(--text-dim); margin-bottom: 3px; }
  #notes-panel { border-top: 1px solid var(--border); padding: 12px 20px; }
  #notes-panel textarea { min-height: 50px; resize: vertical; }
  #notes-existing { max-height: 90px; overflow-y: auto; font-size: 12px; color: var(--text-dim); white-space: pre-wrap; margin-bottom: 8px; }
  #save-status { font-size: 12px; margin-left: 8px; }
</style>
</head>
<body>

<div id="login-screen">
  <div id="login-box">
    <h1>Blake UK Operator Console</h1>
    <p class="sub">Sign in with your admin panel account</p>
    <div id="login-fields">
      <label for="login-user">Username</label>
      <input id="login-user" autocomplete="username">
      <label for="login-pass">Password</label>
      <input id="login-pass" type="password" autocomplete="current-password">
    </div>
    <div id="tfa-fields" class="hidden">
      <label for="login-code">2FA code</label>
      <input id="login-code" inputmode="numeric" autocomplete="one-time-code">
    </div>
    <button class="btn btn-primary" id="login-btn" style="width:100%;margin-top:16px;">Sign in</button>
    <div class="err" id="login-err"></div>
    <div class="server-row">
      <label><span>Server</span><span id="server-toggle" style="color:var(--accent)">change</span></label>
      <input id="server-url-input" style="margin-top:6px" class="hidden">
    </div>
  </div>
</div>

<div id="app">
  <div id="topbar">
    <div class="brand"><span class="status-dot" id="status-dot"></span>Blake UK Operator Console</div>
    <div class="right">
      <span id="whoami"></span>
      <button class="btn btn-sm" id="logout-btn">Sign out</button>
    </div>
  </div>
  <div id="main">
    <div id="sidebar">
      <div id="filters">
        <select id="filter-status">
          <option value="open" selected>Open</option>
          <option value="pending">Pending</option>
          <option value="closed">Closed</option>
          <option value="">All statuses</option>
        </select>
        <select id="filter-dept">
          <option value="">All departments</option>
          <option value="sales">Sales</option>
          <option value="support">Support</option>
          <option value="accounts">Accounts</option>
        </select>
      </div>
      <div id="ticket-list"><div class="empty">Loading…</div></div>
    </div>
    <div id="detail">
      <div class="empty-state">Select a ticket to view the conversation</div>
    </div>
  </div>
</div>

<script>
// ── Config / state ──────────────────────────────────────────────────────────
const DEFAULT_SERVER = 'https://chat.blakegroup.uk';
let serverUrl = localStorage.getItem('opconsole_server') || DEFAULT_SERVER;
let csrf = null;
let tickets = [];
let knownTicketIds = new Set();
let currentTicketId = null;
let pollTimer = null;
const POLL_MS = 8000;

function api(path) { return serverUrl.replace(/\/$/, '') + path; }

async function apiGet(path) {
  const r = await fetch(api(path), { credentials: 'include' });
  return r.json();
}
async function apiSend(method, path, body) {
  const r = await fetch(api(path), {
    method,
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  return r.json();
}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function fmtTime(ts) { return ts ? new Date(ts * 1000).toLocaleString() : ''; }

// ── Native notifications (Tauri) with a safe no-op fallback ────────────────
// Falls back to doing nothing rather than throwing if this HTML is ever
// opened outside the Tauri shell (e.g. during UI development in a plain
// browser) - window.__TAURI__ simply won't exist there.
async function notify(title, body) {
  try {
    const t = window.__TAURI__;
    if (!t || !t.notification) return;
    let granted = await t.notification.isPermissionGranted();
    if (!granted) {
      const perm = await t.notification.requestPermission();
      granted = perm === 'granted';
    }
    if (granted) t.notification.sendNotification({ title, body });
  } catch (e) { /* non-fatal: notification failure should never break the app */ }
}

// ── Login ────────────────────────────────────────────────────────────────────
document.getElementById('server-toggle').onclick = () => {
  const input = document.getElementById('server-url-input');
  input.classList.toggle('hidden');
  if (!input.classList.contains('hidden')) { input.value = serverUrl; input.focus(); }
};
document.getElementById('server-url-input').onchange = (e) => {
  serverUrl = e.target.value.trim() || DEFAULT_SERVER;
  localStorage.setItem('opconsole_server', serverUrl);
};

let awaitingTfa = false;
document.getElementById('login-btn').onclick = doLogin;
document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('login-code').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const errEl = document.getElementById('login-err');
  errEl.textContent = '';
  try {
    let body;
    if (awaitingTfa) {
      body = { code: document.getElementById('login-code').value.trim() };
    } else {
      body = { username: document.getElementById('login-user').value.trim(), password: document.getElementById('login-pass').value };
    }
    const r = await apiSend('POST', '/api/admin/login.php', body);
    if (r.ok) {
      csrf = r.csrf;
      document.getElementById('whoami').textContent = document.getElementById('login-user').value.trim() + ' · ' + (r.role || '');
      enterApp();
      return;
    }
    if (r.requires_2fa) {
      awaitingTfa = true;
      document.getElementById('tfa-fields').classList.remove('hidden');
      document.getElementById('login-code').focus();
      return;
    }
    errEl.textContent = r.error || 'Sign-in failed';
  } catch (e) {
    errEl.innerHTML = 'Could not reach ' + esc(serverUrl) + ' — check the server address and your connection.'
      + '<br><span style="font-size:11px;opacity:.75">Detail: ' + esc((e && e.name || 'Error') + ': ' + (e && e.message || String(e))) + '</span>';
  }
}

function enterApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  loadTickets();
  pollTimer = setInterval(loadTickets, POLL_MS);
}

document.getElementById('logout-btn').onclick = async () => {
  clearInterval(pollTimer);
  try { await fetch(api('/api/admin/login.php'), { method: 'DELETE', credentials: 'include' }); } catch (e) {}
  location.reload();
};

// ── Ticket list + polling/notifications ─────────────────────────────────────
document.getElementById('filter-status').onchange = loadTickets;
document.getElementById('filter-dept').onchange = loadTickets;

async function loadTickets() {
  const status = document.getElementById('filter-status').value;
  const dept = document.getElementById('filter-dept').value;
  const params = new URLSearchParams();
  if (status) params.set('status', status);
  if (dept) params.set('department', dept);
  params.set('limit', '100');

  let result;
  try {
    result = await apiGet('/api/admin/tickets.php?' + params.toString());
    document.getElementById('status-dot').style.background = 'var(--ok)';
  } catch (e) {
    document.getElementById('status-dot').style.background = 'var(--err)';
    return;
  }
  if (!Array.isArray(result)) return;

  // Detect genuinely new tickets since the last poll (first load populates
  // the known set silently - nobody wants a notification storm on startup).
  const isFirstLoad = knownTicketIds.size === 0 && tickets.length === 0;
  const freshIds = new Set(result.map(t => t.id));
  if (!isFirstLoad) {
    for (const t of result) {
      if (!knownTicketIds.has(t.id)) {
        notify('New support ticket', t.subject || ('Ticket #' + t.id));
      }
    }
  }
  knownTicketIds = freshIds;
  tickets = result;
  renderTicketList();
}

function renderTicketList() {
  const el = document.getElementById('ticket-list');
  if (!tickets.length) { el.innerHTML = '<div class="empty">No tickets match this view.</div>'; return; }
  el.innerHTML = tickets.map(t => `
    <div class="ticket-row ${t.id === currentTicketId ? 'active' : ''}" data-id="${t.id}" onclick="openTicket(${t.id})">
      <div class="subj">${esc(t.subject || 'Ticket #' + t.id)}</div>
      <div class="meta">
        <span class="badge badge-${esc(t.status)}">${esc(t.status)}</span>
        ${t.department ? `<span class="badge badge-dept">${esc(t.department)}</span>` : ''}
      </div>
    </div>
  `).join('');
}

// ── Ticket detail ────────────────────────────────────────────────────────────
async function openTicket(id) {
  currentTicketId = id;
  renderTicketList();
  const ticket = tickets.find(t => t.id === id);
  if (!ticket) return;

  let messages = [];
  try {
    const conv = await apiGet('/api/admin/chats.php?session_id=' + encodeURIComponent(ticket.session_id));
    messages = Array.isArray(conv) ? conv : (conv.messages || []);
  } catch (e) { /* transcript is best-effort; routing/notes still work without it */ }

  document.getElementById('detail').innerHTML = `
    <div id="detail-header">
      <h2>${esc(ticket.subject || 'Ticket #' + ticket.id)}</h2>
      <div class="sub">${ticket.customer_email ? esc(ticket.customer_email) + ' · ' : ''}${ticket.page_url ? esc(ticket.page_url) + ' · ' : ''}opened ${fmtTime(ticket.created_at)}</div>
    </div>
    <div id="detail-controls">
      <div class="group">
        <label>Status</label>
        <select id="ctl-status">
          ${['open','pending','closed'].map(s => `<option value="${s}" ${s===ticket.status?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <div class="group">
        <label>Department</label>
        <select id="ctl-dept">
          <option value="">Unassigned</option>
          ${['sales','support','accounts'].map(d => `<option value="${d}" ${d===ticket.department?'selected':''}>${d}</option>`).join('')}
        </select>
      </div>
      <button class="btn btn-primary btn-sm" id="ctl-save">Save</button>
      <span id="save-status"></span>
    </div>
    <div id="transcript">
      ${messages.length ? messages.map(m => `
        <div class="msg msg-${m.role === 'assistant' ? 'assistant' : 'customer'}">
          <div class="msg-meta">${m.role === 'assistant' ? 'Assistant' : 'Customer'} · ${fmtTime(m.created_at)}</div>
          ${esc(m.content || m.message || '')}
        </div>
      `).join('') : '<div style="color:var(--text-dim);font-size:13px">No conversation transcript available.</div>'}
    </div>
    <div id="notes-panel">
      <div id="notes-existing">${ticket.notes ? esc(ticket.notes) : 'No notes yet.'}</div>
      <textarea id="note-input" placeholder="Add a note for the team…"></textarea>
      <button class="btn btn-sm" id="note-save" style="margin-top:6px">Add note</button>
    </div>
  `;

  document.getElementById('ctl-save').onclick = () => saveTicketRouting(ticket.id);
  document.getElementById('note-save').onclick = () => saveNote(ticket.id);
}

async function saveTicketRouting(id) {
  const status = document.getElementById('ctl-status').value;
  const department = document.getElementById('ctl-dept').value;
  const statusEl = document.getElementById('save-status');
  statusEl.textContent = 'Saving…';
  try {
    const r = await apiSend('PUT', '/api/admin/tickets.php', { id, status, department, csrf });
    statusEl.textContent = r.ok ? 'Saved ✓' : (r.error || 'Failed');
    statusEl.style.color = r.ok ? 'var(--ok)' : 'var(--err)';
    if (r.ok) loadTickets();
  } catch (e) {
    statusEl.textContent = 'Could not reach server (' + ((e && e.name) || 'Error') + ': ' + ((e && e.message) || String(e)) + ')';
    statusEl.style.color = 'var(--err)';
  }
}

async function saveNote(id) {
  const input = document.getElementById('note-input');
  const note = input.value.trim();
  if (!note) return;
  try {
    const r = await apiSend('POST', '/api/admin/tickets.php', { id, note, csrf });
    if (r.ok) { input.value = ''; await loadTickets(); openTicket(id); }
  } catch (e) {}
}
</script>
</body>
</html>
