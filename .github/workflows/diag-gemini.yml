name: Diagnose Gemini quota

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Run Gemini quota diagnostic on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_SERVER }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /var/www/chat && sudo -u www-data php scripts/diag/gemini_quota.php 2>&1 || php scripts/diag/gemini_quota.php 2>&1
            echo "--- last queue log lines"
            tail -n 15 /var/www/chat/logs/import_queue.log 2>/dev/null || true
