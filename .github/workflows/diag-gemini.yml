name: Diagnose Gemini quota

on:
  workflow_dispatch:
    inputs:
      requeue_failed:
        description: "Also re-queue every failed knowledge file for background re-indexing"
        type: boolean
        default: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Run Gemini quota diagnostic on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_SERVER }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /var/www/chat && php scripts/diag/gemini_quota.php ${{ github.event.inputs.requeue_failed == 'true' && '--requeue-failed' || '' }} 2>&1
            echo "--- last queue log lines"
            tail -n 15 /var/www/chat/logs/import_queue.log 2>/dev/null || true
