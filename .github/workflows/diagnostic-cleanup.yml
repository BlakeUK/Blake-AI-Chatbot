name: Diagnostic - Cleanup (throwaway)

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Run cleanup on the VPS
        run: |
          echo "" | base64 -d > remote_cleanup.sh
          chmod +x remote_cleanup.sh
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no remote_cleanup.sh "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_SERVER }}:/tmp/remote_cleanup.sh"
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_SERVER }}" "bash /tmp/remote_cleanup.sh"
