name: Create Admin User

on:
  workflow_dispatch:

jobs:
  create-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Create or reset admin user on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.SSH_SERVER }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: ADMIN_USERNAME,ADMIN_PASSWORD
          script: |
            php -r '
            define("ROOT", "/var/www/chat");
            $cfg = require ROOT . "/config/config.php";
            define("CFG", $cfg);
            require ROOT . "/src/bootstrap.php";
            $usernameRaw = getenv("ADMIN_USERNAME");
            $passwordRaw = getenv("ADMIN_PASSWORD");
            $username = trim($usernameRaw);
            $password = trim($passwordRaw);
            // A copy-pasted GitHub secret can silently pick up a trailing
            // newline/space, which would make the stored hash never match
            // what someone actually types at the login form. Trim both
            // values and report (lengths only, never the values) whether
            // trimming changed anything, so a future "still invalid" report
            // can be diagnosed from the run log without exposing secrets.
            echo "Username length: raw=" . strlen($usernameRaw) . " trimmed=" . strlen($username) . PHP_EOL;
            echo "Password length: raw=" . strlen($passwordRaw) . " trimmed=" . strlen($password) . PHP_EOL;
            $pdo = db();
            $existing = $pdo->prepare("SELECT id, role, totp_enabled FROM admin_users WHERE username = ?");
            $existing->execute([$username]);
            $row = $existing->fetch();
            echo "Before: " . ($row ? json_encode($row) : "no such user") . PHP_EOL;
            $hash = password_hash($password, PASSWORD_BCRYPT, ["cost" => 12]);
            if ($row) {
                $pdo->prepare("UPDATE admin_users SET password=?, role=\"admin\", totp_enabled=0, totp_secret_enc=NULL, totp_secret_iv=NULL, totp_secret_tag=NULL, backup_codes=NULL WHERE id=?")
                    ->execute([$hash, $row["id"]]);
                echo "Fixed existing user id={$row["id"]}: password reset, role=admin, 2FA cleared." . PHP_EOL;
            } else {
                $pdo->prepare("INSERT INTO admin_users (username, password, role) VALUES (?, ?, \"admin\")")->execute([$username, $hash]);
                echo "Created new admin user." . PHP_EOL;
            }
            '
