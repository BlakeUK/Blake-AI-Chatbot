name: Build Android APKs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Build customer app APK
        working-directory: mobile/customer_app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Build admin app APK
        working-directory: mobile/admin_app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Rename APKs for release
        run: |
          mkdir -p release-apks
          cp mobile/customer_app/build/app/outputs/flutter-apk/app-release.apk release-apks/blake-uk-customer-app.apk
          cp mobile/admin_app/build/app/outputs/flutter-apk/app-release.apk release-apks/blake-uk-admin-app.apk

      - name: Upload customer app APK
        uses: actions/upload-artifact@v4
        with:
          name: blake-uk-customer-app
          path: release-apks/blake-uk-customer-app.apk

      - name: Upload admin app APK
        uses: actions/upload-artifact@v4
        with:
          name: blake-uk-admin-app
          path: release-apks/blake-uk-admin-app.apk

      - name: Publish/update "latest" release with both APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest Android APKs
          body: |
            Auto-built from `${{ github.sha }}` on ${{ github.event.repository.updated_at }}.
            This release is updated in place on every build - download links below always
            point to the most recent APKs.
          prerelease: true
          files: |
            release-apks/blake-uk-customer-app.apk
            release-apks/blake-uk-admin-app.apk
