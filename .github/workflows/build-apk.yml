name: Build Android APKs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Build customer app APK
        working-directory: mobile/customer_app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Build admin app APK
        working-directory: mobile/admin_app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload customer app APK
        uses: actions/upload-artifact@v4
        with:
          name: blake-uk-customer-app
          path: mobile/customer_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload admin app APK
        uses: actions/upload-artifact@v4
        with:
          name: blake-uk-admin-app
          path: mobile/admin_app/build/app/outputs/flutter-apk/app-release.apk
