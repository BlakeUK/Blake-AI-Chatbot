name: Diagnostic - Agents Check (throwaway)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run diagnostic on the VPS
        run: |
          echo "" | base64 -d > remote_check.sh
          chmod +x remote_check.sh
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no remote_check.sh "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_SERVER }}:/tmp/remote_check.sh"
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_SERVER }}" "bash /tmp/remote_check.sh" > diagnostic-output.txt 2>&1
          cat diagnostic-output.txt
      - name: Commit result
        run: |
          git config user.name "Claude (Anthropic)"
          git config user.email "noreply@anthropic.com"
          git add diagnostic-output.txt
          git commit -m "Diagnostic output 2"
          git push --force origin HEAD:diagnostic/agents-check
