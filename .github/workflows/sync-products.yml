name: Sync products from blake-uk.com

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Only this many pages (0 = full catalogue)"
        default: "0"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Run product sync on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_SERVER }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 55m
          script: |
            cd /var/www/chat
            LIMIT=$(printf '%d' "${{ github.event.inputs.limit }}" 2>/dev/null || echo 0)
            ARGS=""; [ "$LIMIT" -gt 0 ] && ARGS="--limit=$LIMIT"
            # Run as www-data so the DB, WAL files and logs stay owned by the web user.
            if [ "$(id -u)" = "0" ]; then RUN="runuser -u www-data --"; else RUN=""; fi
            $RUN php scripts/sync_site_products.php $ARGS 2>&1 | tail -40
            chown www-data:www-data data/chatbot.db* logs/product_sync.log 2>/dev/null || true
