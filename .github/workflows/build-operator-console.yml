name: Build Operator Console

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: operator-console/src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential \
            curl wget file libssl-dev pkg-config patchelf

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^1" --locked

      - name: Build .deb
        working-directory: operator-console
        shell: bash
        run: |
          set +e
          cargo tauri build 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::Build failed - emitting last 60 log lines as annotations"
            tail -n 60 /tmp/build.log | while IFS= read -r line; do
              esc=$(printf '%s' "$line" | sed 's/%/%25/g')
              echo "::error::${esc}"
            done
            echo "::endgroup::"
            exit "$status"
          fi

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: operator-console-linux
          path: operator-console/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: operator-console/src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^1" --locked

      - name: Build .msi
        working-directory: operator-console
        shell: bash
        run: |
          set +e
          cargo tauri build 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::Build failed - emitting last 60 log lines as annotations"
            tail -n 60 /tmp/build.log | while IFS= read -r line; do
              esc=$(printf '%s' "$line" | sed 's/%/%25/g')
              echo "::error::${esc}"
            done
            echo "::endgroup::"
            exit "$status"
          fi

      - name: Upload .msi artifact
        uses: actions/upload-artifact@v4
        with:
          name: operator-console-windows
          path: operator-console/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  publish-to-vps:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: operator-console-linux
          path: dl/linux

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: operator-console-windows
          path: dl/windows

      # Built filenames include the version (e.g. blake-uk-operator-console_0.1.0_amd64.deb),
      # which would change every release and break any link staff had bookmarked.
      # Renaming to fixed filenames here keeps the download URL permanently stable;
      # the versioned originals are still visible in the workflow's own artifacts above
      # if a specific past version is ever needed.
      - name: Prepare stable filenames
        run: |
          mkdir -p publish
          cp dl/linux/*.deb "publish/blake-uk-operator-console.deb"
          cp dl/windows/*.msi "publish/blake-uk-operator-console.msi"
          VERSION=$(jq -r '.package.version' operator-console/src-tauri/tauri.conf.json)
          printf '{"version":"%s"}' "$VERSION" > publish/version.json
          echo "Built version: $VERSION"
          ls -la publish

      - name: Ensure the downloads directory exists on the VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_SERVER }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: mkdir -p /var/www/blakegroup/public/downloads

      - name: Upload installers to the VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_SERVER }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "publish/blake-uk-operator-console.deb,publish/blake-uk-operator-console.msi,publish/version.json"
          target: "/var/www/blakegroup/public/downloads"
          strip_components: 1
          overwrite: true

      - name: Fix ownership on the VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_SERVER }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            chown -R www-data:www-data /var/www/blakegroup/public/downloads
