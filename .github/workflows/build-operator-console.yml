name: Build Operator Console

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: operator-console/src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential \
            curl wget file libssl-dev pkg-config patchelf

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^1" --locked

      - name: Build .deb
        working-directory: operator-console
        shell: bash
        run: |
          set +e
          cargo tauri build 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::Build failed - emitting last 60 log lines as annotations"
            tail -n 60 /tmp/build.log | while IFS= read -r line; do
              esc=$(printf '%s' "$line" | sed 's/%/%25/g')
              echo "::error::${esc}"
            done
            echo "::endgroup::"
            exit "$status"
          fi

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: operator-console-linux
          path: operator-console/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: operator-console/src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^1" --locked

      - name: Build NSIS installer
        working-directory: operator-console
        shell: bash
        run: |
          set +e
          cargo tauri build 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::Build failed - emitting last 60 log lines as annotations"
            tail -n 60 /tmp/build.log | while IFS= read -r line; do
              esc=$(printf '%s' "$line" | sed 's/%/%25/g')
              echo "::error::${esc}"
            done
            echo "::endgroup::"
            exit "$status"
          fi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: operator-console-windows
          path: |
            operator-console/src-tauri/target/release/bundle/nsis/*-setup.exe
            operator-console/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  publish-to-vps:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: operator-console-linux
          path: dl/linux

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: operator-console-windows
          path: dl/windows

      # Built filenames include the version (e.g. blake-uk-operator-console_0.1.0_amd64.deb),
      # which would change every release and break any link staff had bookmarked.
      # Renaming to fixed filenames here keeps the download URL permanently stable;
      # the versioned originals are still visible in the workflow's own artifacts above
      # if a specific past version is ever needed.
      - name: Prepare stable filenames
        run: |
          mkdir -p publish
          # The Windows artifact keeps its nsis/ and msi/ folders, so search.
          cp "$(find dl/windows -name '*-setup.exe' | head -1)" "publish/blake-uk-operator-console-setup.exe"
          MSI_SRC=$(find dl/windows -name '*.msi' | head -1)
          [ -n "$MSI_SRC" ] && cp "$MSI_SRC" "publish/blake-uk-operator-console.msi" || echo "no msi built"
          cp "$(find dl/linux -name '*.deb' | head -1)" "publish/blake-uk-operator-console.deb"
          VERSION=$(jq -r '.package.version' operator-console/src-tauri/tauri.conf.json)
          # Checksums so anyone can prove the download matches what this
          # workflow built (useful when an antivirus flags an unsigned installer).
          ( cd publish && sha256sum blake-uk-operator-console-setup.exe blake-uk-operator-console.deb \
              $( [ -f blake-uk-operator-console.msi ] && echo blake-uk-operator-console.msi ) > SHA256SUMS.txt )
          EXE_SHA=$(awk '/setup.exe/{print $1}' publish/SHA256SUMS.txt)
          DEB_SHA=$(awk '/\.deb/{print $1}' publish/SHA256SUMS.txt)
          MSI_SHA=$(awk '/\.msi/{print $1}' publish/SHA256SUMS.txt)
          jq -n --arg v "$VERSION" --arg e "$EXE_SHA" --arg d "$DEB_SHA" --arg m "$MSI_SHA" \
             --arg b "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
             '{version:$v, sha256:{exe:$e, deb:$d, msi:$m}, built_by:$b, built_at:(now|todate)}' > publish/version.json
          echo "Built version: $VERSION"
          ls -la publish

      - name: Write the release notes
        run: |
          VERSION=$(jq -r '.version' publish/version.json)
          {
            echo "## Blake UK Operator Console $VERSION"
            echo
            echo "| File | For |"
            echo "|---|---|"
            echo "| \`blake-uk-operator-console-setup.exe\` | Windows (recommended installer) |"
            echo "| \`blake-uk-operator-console.msi\` | Windows (for managed installs) |"
            echo "| \`blake-uk-operator-console.deb\` | Debian / Ubuntu Linux |"
            echo
            echo "Built from commit \`${GITHUB_SHA::7}\` by [this workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            echo
            echo "**Installing:** the installers are not code-signed, so Windows may show a SmartScreen warning: choose *More info*, then *Run anyway*. If you want to check a download, compare it with \`SHA256SUMS.txt\` (in PowerShell: \`Get-FileHash <file>\`)."
            echo
            echo "**Updating:** an installed app shows an *Update* button when a newer build is published. The same files are also served from the company website."
            echo
            echo "SHA-256:"
            echo '```'
            cat publish/SHA256SUMS.txt
            echo '```'
          } > publish/RELEASE_NOTES.md

      - name: Keep the prepared files for the GitHub release
        uses: actions/upload-artifact@v4
        with:
          name: console-publish
          path: publish
          retention-days: 30
          if-no-files-found: error

      - name: Ensure the downloads directory exists on the VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_SERVER }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: mkdir -p /var/www/blakegroup/public/downloads

      - name: Upload installers to the VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_SERVER }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "publish/blake-uk-operator-console.deb,publish/blake-uk-operator-console-setup.exe,publish/blake-uk-operator-console.msi,publish/version.json,publish/SHA256SUMS.txt"
          target: "/var/www/blakegroup/public/downloads"
          strip_components: 1
          overwrite: true

      - name: Fix ownership on the VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_SERVER }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            chown -R www-data:www-data /var/www/blakegroup/public/downloads
            ls -la /var/www/blakegroup/public/downloads

  # The installers are also attached to GitHub releases, so they can be downloaded from the repository:
  #   console-v<version>  one permanent release per version
  #   console-latest      a rolling release that always holds the newest build (a fixed link)
  # This runs even if the upload to the VPS fails, because the files are already prepared.
  publish-to-github:
    needs: publish-to-vps
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the prepared files
        uses: actions/download-artifact@v4
        with:
          name: console-publish
          path: publish

      - name: Read the version
        id: v
        run: echo "version=$(jq -r '.version' publish/version.json)" >> "$GITHUB_OUTPUT"

      - name: Release for this version (kept)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: console-v${{ steps.v.outputs.version }}
          name: Operator Console ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: publish/RELEASE_NOTES.md
          make_latest: "false"
          fail_on_unmatched_files: false
          files: |
            publish/blake-uk-operator-console-setup.exe
            publish/blake-uk-operator-console.msi
            publish/blake-uk-operator-console.deb
            publish/SHA256SUMS.txt
            publish/version.json

      - name: Rolling release with the newest build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: console-latest
          name: Operator Console, newest build (${{ steps.v.outputs.version }})
          target_commitish: ${{ github.sha }}
          body_path: publish/RELEASE_NOTES.md
          make_latest: "true"
          fail_on_unmatched_files: false
          files: |
            publish/blake-uk-operator-console-setup.exe
            publish/blake-uk-operator-console.msi
            publish/blake-uk-operator-console.deb
            publish/SHA256SUMS.txt
            publish/version.json
