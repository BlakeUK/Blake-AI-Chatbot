name: Fetch Ofcom spreadsheet via VPS

# Ofcom's site blocks GitHub-hosted runners. This fetches the transmitter
# spreadsheet from the VPS and prints it base64-encoded to the job log so it
# can be committed to scripts/reception/source/. Nothing is written on the VPS
# except a temp file that is removed again.

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_SERVER }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            F=$(mktemp)
            curl -fsSL --retry 3 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
              -o "$F" "https://www.ofcom.org.uk/siteassets/resources/documents/spectrum/tv-transmitter-guidance/700-plan-clearance.xlsx"
            head -c 2 "$F" | grep -q PK || { echo "not an xlsx"; head -c 300 "$F"; rm -f "$F"; exit 1; }
            echo "XLSX_SHA256 $(sha256sum "$F" | cut -d' ' -f1)"
            echo "XLSX_B64_BEGIN"
            base64 -w 0 "$F"; echo
            echo "XLSX_B64_END"
            rm -f "$F"
