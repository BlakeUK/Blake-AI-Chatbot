name: Diagnose knowledge base

on:
  workflow_dispatch:
    inputs:
      recent:
        description: "Number of recent files to report"
        default: "8"

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Knowledge base report (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_SERVER }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 10m
          script: |
            cd /var/www/chat && sudo -n -u www-data php scripts/diag/knowledge_report.php "${{ github.event.inputs.recent }}" 2>&1 || php scripts/diag/knowledge_report.php "${{ github.event.inputs.recent }}" 2>&1
