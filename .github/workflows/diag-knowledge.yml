name: Diagnose product knowledge

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Product code"
        default: "BLATLA11"

jobs:
  k:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_SERVER }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: cd /var/www/chat && su -s /bin/sh www-data -c "php scripts/diag/product_knowledge.php '${{ github.event.inputs.code }}'"
