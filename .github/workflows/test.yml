name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fast-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP 8.2 (matches production)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sqlite3, pdo_sqlite, curl, mbstring, xml, intl, fileinfo

      - name: Run fast regression suite
        run: php tests/run.php
