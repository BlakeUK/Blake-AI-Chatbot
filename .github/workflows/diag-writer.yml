name: Diagnose the writing assistant (real model)

# Runs a few fictional messages through the real Gemini model with the writing assistant's prompt and prints the
# results, so the prompt's rules (British English, minimal change, no invented facts, no banned phrases) can be
# checked against what the model actually does. Nothing is stored; the usual API usage record is the only trace.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model to try (leave empty for the one the tool uses)
        required: false
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the model name
        env:
          MODEL: ${{ inputs.model }}
        run: |
          [[ -z "$MODEL" || "$MODEL" =~ ^gemini-[a-z0-9.-]+$ ]] || { echo "not a valid model name"; exit 1; }
      - name: Run on the VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          WRITER_MODEL: ${{ inputs.model }}
        with:
          host: ${{ secrets.SSH_SERVER }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 8m
          envs: WRITER_MODEL
          script: |
            cd /var/www/chat
            echo "== which models this server is set up to use"
            php -r 'require "src/bootstrap.php"; foreach (["gemini_chat_model","gemini_extract_model","gemini_writer_model"] as $k) { $q = db()->prepare("SELECT value FROM settings WHERE key = ?"); $q->execute([$k]); echo $k, " (setting): ", var_export($q->fetchColumn(), true), "\n"; } echo "config gemini_flash: ", CFG["gemini_flash"], "\nconfig gemini_pro: ", CFG["gemini_pro"], "\n";'
            echo "== the check"
            php scripts/diag/writer_check.php
