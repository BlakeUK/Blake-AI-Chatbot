name: Diagnose Newsroom AI under newspaper load

# A burst of tiny AI calls (to see if the server refuses any), a real request to each picture model, and a story-rewrite-shaped request.
on:
  workflow_dispatch:

jobs:
  ai:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prepare the script for the server
        run: echo "SCRIPT_B64=$(base64 -w0 scripts/diag/newsroom_ai_check.py)" >> "$GITHUB_ENV"
      - name: Run on the VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          envs: SCRIPT_B64
          host: ${{ secrets.SSH_SERVER }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 8m
          script: |
            cd /var/www/chat
            trap 'runuser -u www-data -- php scripts/diag/newsroom_qr_check.php cleanup >/dev/null; echo "== cleaned up"' EXIT
            OUT=$(runuser -u www-data -- php scripts/diag/newsroom_qr_check.php prepare) || { echo "PREPARE FAILED: $OUT"; exit 1; }
            PASS=$(echo "$OUT" | grep '^NEWS_PASS=' | cut -d= -f2-)
            echo "$SCRIPT_B64" | base64 -d > /tmp/newsroom_ai_check.py
            python3 /tmp/newsroom_ai_check.py "$PASS"; rc=$?; rm -f /tmp/newsroom_ai_check.py; exit $rc
